git:
  diffRenderers:
    - colorArg: always
      # https://github.com/dandavison/delta
      command: delta --dark --paging=never --hunk-header-style=omit --file-style=omit

# https://github.com/WTFox/luna.nvim/blob/main/extras/lazygit/luna.yml
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#75a1c7"
      - bold
    inactiveBorderColor:
      - "#404040"
    optionsTextColor:
      - "#75a1c7"
    selectedLineBgColor:
      - "#212121"
    selectedRangeBgColor:
      - "#212121"
    cherryPickedCommitBgColor:
      - "#c4a8d6"
    cherryPickedCommitFgColor:
      - "#75a1c7"
    unstagedChangesColor:
      - "#e08585"
    defaultFgColor:
      - "#e4e4e8"
    searchingActiveBorderColor:
      - "#d9a35a"
      - bold

notARepository: skip
